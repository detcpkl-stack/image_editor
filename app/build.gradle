
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.aiphotostudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.aiphotostudio'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        buildConfigField "String", "AI_SERVER_URL", "\"https://YOUR-SERVICE.onrender.com\""
    }
}
