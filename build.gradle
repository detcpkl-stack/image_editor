plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.aiphotostudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.aiphotostudio'
        minSdk 31
        targetSdk 35
        versionCode 2
        versionName '1.1'

        // Replace this URL after deploying the Python AI server.
        // Do not put your OpenAI API key in this Android app.
        buildConfigField "String", "AI_SERVER_URL", "\"https://YOUR-SERVICE.onrender.com\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
