
name: Build AI Photo Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android Manifest
        run: |
          echo "Checking AndroidManifest.xml"
          cat -A app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "app/src/main/AndroidManifest.xml"
          try:
              ET.parse(path)
              print("SUCCESS: Valid XML")
          except ET.ParseError as e:
              print("MANIFEST ERROR:", e)
              raise
          PY

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Photo-Studio-APK
          path: app/build/outputs/apk/debug/app-debug.apk

